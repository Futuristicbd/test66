const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,u)=>a+(b-a)*u;

const eoX=x=>{x=clamp(x);return x>=1?1:1-Math.pow(2,-10*x)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eio5=x=>{x=clamp(x);return x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2};
const eioX=x=>{x=clamp(x);return x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2};
const SPR=(tau,w,z)=>{if(tau<=0)return 0;if(z<1){const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*tau)*(Math.cos(wd*tau)+z*w/wd*Math.sin(wd*tau));}return 1-Math.exp(-w*tau)*(1+w*tau);};
const HIT=(t,t0)=>SPR(t-t0,24,0.52);            // ~15% overshoot
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const mk=(p,html,css='',cls='a')=>{const d=document.createElement('div');d.className=cls;d.style.cssText+=css;d.innerHTML=html;p.appendChild(d);return d;};
const L=()=>mk(S,'','','L');
const vis=(e,o)=>{if(o<=0.002){e.style.display='none';return false;}e.style.display='';e.style.opacity=o.toFixed(4);return true;};

function put(e,{x=0,y=0,s=1,sx,sy,r=0,o=1,b=0,ax='c',pre=''}={}){
  if(!vis(e,o))return false;
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) translate(${ax=='l'?'0':'-50%'},-50%) ${pre} scale(${(sx??s).toFixed(4)},${(sy??s).toFixed(4)}) rotate(${r}deg)`;
  e.style.filter=b>0.05?`blur(${b.toFixed(2)}px)`:'none'; return true;}
// in/out envelope: a = entered, b = exited
const env=(t,tin,tout,din=.45,dout=.28)=>({a:tin==null?1:eoX((t-tin)/din), b:tout==null?0:eio((t-tout)/dout)});

function words(p,parts,css){const d=mk(p,'',css,'t');const sp=[];parts.forEach(([s,c,wt],i)=>{const e=document.createElement('span');e.className='w';e.textContent=s+(i<parts.length-1?' ':'');if(c)e.style.color=c;if(wt)e.style.fontWeight=wt;d.appendChild(e);sp.push(e);});return {d,sp};}

  <div class="a" id="q4" style="left:136px;top:196px;font-size:38px;font-weight:500;white-space:nowrap"></div>

{let h='';for(let i=0;i<4;i++)h+=`<div class="a" id="r4${i}" style="left:40px;top:${310+i*96}px;width:740px;height:80px;border-radius:24px"><div class="a" style="left:14px;top:10px;width:60px;height:60px;border-radius:18px;background:#E2EAF7"></div><div class="sk" style="left:96px;top:20px;width:${[330,280,360,300][i]}px"></div><div class="sk" style="left:96px;top:46px;width:${[200,170,230,150][i]}px;background:#EDF2FA"></div></div>`;card4.querySelector('#rows4').innerHTML=h;}

function seek(t){
  const ta=Math.min(t,HOLD);
  for(const [l,a,b] of LAYERS) l.style.display=(t>=a&&t<b)?'':'none';

  /* ground */
  const intro=1-eio((t-12)/3);           // bolder blue early, calmer later
  const bp=[[900+130*Math.sin(ta*.45),260+120*Math.cos(ta*.33),1+.25*intro],[120+100*Math.cos(ta*.3),1250+160*Math.sin(ta*.27),1],
    [520+220*Math.sin(ta*.22+1),900+260*Math.cos(ta*.19),1],[80+60*Math.sin(ta*.5),1900,.8+.4*intro],[980,1500+120*Math.sin(ta*.35),1]];
  BL.forEach((e,i)=>{e.style.transform=`translate(${bp[i][0].toFixed(1)}px,${bp[i][1].toFixed(1)}px) scale(${bp[i][2].toFixed(3)})`;});
  const gf=Math.floor(ta*24); grain.style.transform=`translate(${(gf*137)%300}px,${(gf*211)%300}px)`;

  /* 1 · HUD */
  if(t<2.4){
    const out=eio((t-1.95)/.35);
