<!doctype html><html><head><meta charset="utf-8"><title>FuturisticBD Personal Branding v4</title>
<style>
@font-face{font-family:'Geist';src:url(data:font/woff2;base64,__GEIST__) format('woff2');font-weight:100 900}
@font-face{font-family:'Geist Mono';src:url(data:font/woff2;base64,__GEISTMONO__) format('woff2');font-weight:100 900}
html,body{margin:0;background:#F3F6FB;overflow:hidden}
body.preview{background:#111;height:100vh}
body.preview #wrap{position:fixed;left:50%;top:50%}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F3F6FB;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#0B2238;font-weight:500;letter-spacing:-.035em}
.a{position:absolute;left:0;top:0}
.t{position:absolute;left:0;top:0;white-space:nowrap}
.S{position:absolute;left:0;top:0;width:1080px;height:1920px}
.w{display:inline-block;white-space:pre}
.g{background:linear-gradient(95deg,#1C6FE0 0%,#3D92F5 45%,#62BCFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .04em}
.mono{font-family:'Geist Mono',ui-monospace,monospace;letter-spacing:.14em;font-weight:500}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(245,249,255,.9));box-shadow:0 0 0 2px rgba(120,170,255,.35) inset,0 40px 90px -30px rgba(40,110,230,.45),0 8px 30px -10px rgba(40,110,230,.25)}
.sk{position:absolute;height:14px;border-radius:7px;background:#E4ECF8}
svg{display:block;overflow:visible}
</style></head><body><div id="wrap"><div id="stage"></div></div>
<script>
/* FuturisticBD — Personal Branding v4, in the language of the LangEase launch film:
   pale cool ground, calm type with gradient keywords, glass objects moved by a hand cursor,
   a camera flying through phones, ribbon → progress → Live, tilted dashboard, button click, sparkle → logo. */
const S=document.getElementById('stage');
const W=1080,H=1920,CX=510,CY=930,T=25,HOLD=24.45;
const INK='#0B2238', NAVY='#084268', MUTE='#7A8AA3', BLUE='#1C6FE0', SKY='#62BCFF';
const GRAD='linear-gradient(135deg,#1C6FE0 0%,#3D92F5 50%,#62BCFF 100%)';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,u)=>a+(b-a)*u;
const eo3=x=>1-Math.pow(1-clamp(x),3);
const eoX=x=>{x=clamp(x);return x>=1?1:1-Math.pow(2,-10*x)};
const eiX=x=>{x=clamp(x);return x<=0?0:Math.pow(2,10*x-10)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eio5=x=>{x=clamp(x);return x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2};
const SPR=(tau,w,z)=>{if(tau<=0)return 0;if(z<1){const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*tau)*(Math.cos(wd*tau)+z*w/wd*Math.sin(wd*tau));}return 1-Math.exp(-w*tau)*(1+w*tau);};
const rnd=(i,k=1)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const mk=(p,html,css='',cls='a')=>{const d=document.createElement('div');d.className=cls;d.style.cssText+=css;d.innerHTML=html;p.appendChild(d);return d;};
const show=(e,o)=>{if(o<=0.003){e.style.display='none';return false;}e.style.display='';e.style.opacity=o.toFixed(4);return true;};
function put(e,{x=0,y=0,s=1,sx,sy,r=0,o=1,b=0,ax='c',pre='',post=''}={}){
  if(!show(e,o))return false;
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) ${pre} translate(${ax=='l'?'0':'-50%'},-50%) scale(${(sx??s).toFixed(4)},${(sy??s).toFixed(4)}) rotate(${r.toFixed(2)}deg) ${post}`;
  e.style.filter=b>0.05?`blur(${b.toFixed(2)}px)`:'none';return true;}
function words(p,parts,css){const d=mk(p,'',css,'t');const sp=[];parts.forEach(([s,cls,c],i)=>{const e=document.createElement('span');e.className='w'+(cls?' '+cls:'');e.textContent=s+(i<parts.length-1?' ':'');if(c)e.style.cssText+=c;d.appendChild(e);sp.push(e);});return {d,sp};}
// calm word reveal: soft blur, a short drift from the right
function rv(Wd,t,tin,{st=.12,d=.7,dx=40,dy=0,bl=18,sc=0}={}){
  Wd.sp.forEach((e,i)=>{const a=eo3((t-tin-i*st)/d), k=1-a;
    e.style.opacity=clamp(a*1.3).toFixed(3); e.style.filter=k*bl>.05?`blur(${(k*bl).toFixed(1)}px)`:'none';
    e.style.transform=`translate(${(k*dx).toFixed(1)}px,${(k*dy).toFixed(1)}px) scale(${(1+k*sc).toFixed(4)})`;});}
const NOISE="data:image/svg+xml;utf8,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>");
const blob=(p,c,r)=>mk(p,'',`width:${r*2}px;height:${r*2}px;margin:-${r}px 0 0 -${r}px;border-radius:50%;background:radial-gradient(circle, ${c} 0%, rgba(243,246,251,0) 68%)`);
const person=(bg,fg)=>`<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="${bg}"/><circle cx="50" cy="42" r="16" fill="${fg}"/><path d="M16 100c3-22 17-34 34-34s31 12 34 34" fill="${fg}"/></svg>`;
const HAND=`<svg width="78" height="78" viewBox="0 0 24 24" fill="#fff" stroke="#0B2238" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v0M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`;
const STAR=(s,id='')=>`<svg width="${s}" height="${s}" viewBox="-50 -50 100 100"><defs><linearGradient id="sg${id}" x1="0" y1="-1" x2="1" y2="1"><stop offset="0" stop-color="#62BCFF"/><stop offset="1" stop-color="#1C6FE0"/></linearGradient></defs><path d="M0-50C4-18 18-4 50 0C18 4 4 18 0 50C-4 18-18 4-50 0C-18-4-4-18 0-50Z" fill="url(#sg${id})"/></svg>`;
const IMG={flame:'__FLAME__',word:'__WORDMARK__',url:'__URL__'};
const phoneUI=(k)=>`<div class="a" style="left:14px;top:14px;right:14px;bottom:14px;border-radius:52px;background:#fff;overflow:hidden">
  <div class="a" style="left:50%;top:18px;width:120px;height:30px;margin-left:-60px;border-radius:15px;background:#0E1726"></div>
  <div class="sk" style="left:40px;top:80px;width:180px;background:#D8E4F6"></div><div class="sk" style="left:40px;top:108px;width:110px"></div>
  <div class="a" style="left:40px;top:150px;right:40px;height:${[430,360,480][k%3]}px;border-radius:30px;background:linear-gradient(160deg,${['#62BCFF','#3D92F5','#9CCBFF'][k%3]},${['#1C6FE0','#0E4FB0','#3D92F5'][k%3]});overflow:hidden">
    <div class="a" style="left:0;right:0;bottom:0;height:62%">${person('rgba(0,0,0,0)','rgba(255,255,255,.55)')}</div>
    <div class="a" style="left:50%;top:40%;transform:translate(-40%,-50%)"><svg width="70" height="70" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5Z" fill="#fff"/></svg></div></div>
  ${[0,1,2,3].map(i=>`<div class="sk" style="left:40px;top:${[610,540,660][k%3]+i*38}px;width:${[380,300,340,220][i]}px"></div>`).join('')}
  <div class="a" style="left:40px;right:40px;bottom:50px;height:70px;border-radius:35px;background:${GRAD}"></div></div>`;

/* ================= ground ================= */
const G=mk(S,'','width:1080px;height:1920px');
const BLS=[blob(G,'rgba(170,205,255,.55)',820),blob(G,'rgba(255,255,255,1)',700),blob(G,'rgba(190,215,255,.5)',760)];

/* ================= scenes ================= */
const SC=[]; const scene=(a,b,fn)=>{const l=mk(S,'','','S');SC.push({l,a,b,fn});return l;};
const hand=mk(S,HAND,'z-index:40;filter:drop-shadow(0 6px 10px rgba(11,34,56,.25));transform-origin:30% 10%','t');
let HANDSTATE=null; // set by scenes each frame {x,y,press,o}

/* S1 · Turn your expertise → Influence. */
const s1=scene(0,3.25,(t)=>{
  const o1=eio((t-1.3)/.4);
  rv(s1a,t,.1,{st:.3});
  put(s1a.d,{x:CX,y:900,o:1-o1,b:o1*18,s:1-o1*.04});
  const a=eo3((t-1.4)/.9), out=eio((t-2.9)/.35);
  put(s1b,{x:CX,y:920-out*60,s:(1.16-.16*a)*(1+.035*clamp((t-1.4)/1.6))*(1-out*.04),o:clamp(a*1.6)*(1-out),b:(1-a)*46+out*22});});
const s1a=words(s1,[['Turn','g'],['your'],['expertise']],'font-size:96px;font-weight:500');
const s1b=mk(s1,'Influence.','font-size:178px;font-weight:600;letter-spacing:-.055em','t g');

/* S2 · Your knowledge [folder] Our craft → drag into the studio */
const s2=scene(3.0,6.75,(t)=>{
  const up=eio((t-4.5)/.5);
  rv(s2a,t,3.1,{st:.14}); put(s2a.d,{x:CX,y:620-up*80,o:1-up,b:up*14});
  rv(s2b,t,3.75,{st:.14}); put(s2b.d,{x:CX,y:1250+up*80,o:1-up,b:up*14});
  // folder: springs in, then is dragged down into the studio panel
  const pop=SPR(t-3.4,16,.62), drag=eio((t-4.7)/.7), drop=eio((t-5.4)/.35);
  const fx=CX+Math.sin(Math.PI*drag)*-40, fy=lerp(935,1180,drag)+drop*20;
  put(fold,{x:fx,y:fy,s:Math.max(0,pop)*(1-.12*clamp((t-4.6)/.1)*(t<5.4?1:0))*(1-drop*.55),r:(1-clamp(pop))*-18+Math.sin(Math.PI*drag)*-6,o:clamp(pop*2)*(1-drop)});
  fold.querySelector('#flap').style.transform=`perspective(600px) rotateX(${(-10-8*Math.sin(t*2.2)).toFixed(2)}deg)`;
  // studio panel rises
  const pa=eo3((t-4.75)/.7), glow=clamp(1-Math.abs(t-5.6)/.45), pout=eio((t-6.1)/.55);
  put(pan,{x:CX,y:1180+(1-pa)*420-pout*120,o:clamp(pa*1.5)*(1-pout),b:(1-pa)*14+pout*20,s:1+pout*.25,pre:`perspective(1500px) rotateX(${((1-pa)*30+pout*-25).toFixed(2)}deg)`});
  pan.style.boxShadow=`0 0 0 2px rgba(120,170,255,${(.35+.5*glow).toFixed(3)}) inset,0 40px 90px -30px rgba(40,110,230,${(.45+.4*glow).toFixed(3)}),0 0 ${(60*glow).toFixed(0)}px ${(10*glow).toFixed(0)}px rgba(98,188,255,${(.5*glow).toFixed(3)})`;
  const fill=eo3((t-5.45)/.4); pan.querySelector('#pf').style.transform=`scale(${(.4+.6*fill).toFixed(3)})`; pan.querySelector('#pf').style.opacity=fill;
  // hand
  const hin=eo3((t-4.05)/.45), hout=eio((t-5.6)/.4);
  const hx=t<4.7?lerp(900,fx+60,hin):fx+60+hout*300, hy=t<4.7?lerp(1500,fy+40,hin):fy+40+hout*300;
  HANDSTATE={x:hx,y:hy,o:hin*(1-hout),press:(t>4.55&&t<5.4)?1:0};});
const s2a=words(s2,[['Your'],['knowledge']],'font-size:88px');
const s2b=words(s2,[['Our','g'],['craft','g']],'font-size:88px');
const fold=mk(s2,`
  <div class="a" style="left:0;top:0;width:320px;height:250px;border-radius:30px;background:linear-gradient(160deg,#3D92F5,#1C6FE0)"></div>
  <div class="a" style="left:18px;top:-8px;width:120px;height:40px;border-radius:14px;background:#2E80EC"></div>
  <div class="a" style="left:34px;top:-26px;width:250px;height:190px;border-radius:18px;background:#fff;transform:rotate(-5deg);box-shadow:0 6px 20px rgba(0,40,120,.2)"><div class="sk" style="left:24px;top:30px;width:150px"></div><div class="sk" style="left:24px;top:58px;width:110px"></div></div>
  <div class="a" style="left:56px;top:-40px;width:240px;height:190px;border-radius:18px;background:#F4F8FF;transform:rotate(4deg);box-shadow:0 6px 20px rgba(0,40,120,.2)"><div class="a" style="left:88px;top:40px"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#1C6FE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></div></div>
  <div id="flap" class="a" style="left:0;top:70px;width:320px;height:180px;border-radius:26px;background:linear-gradient(170deg,rgba(150,205,255,.78),rgba(40,120,235,.92));box-shadow:inset 0 2px 0 rgba(255,255,255,.7);transform-origin:50% 100%">
    <div class="a" style="left:26px;top:112px;font-size:28px;color:#fff;font-weight:500;letter-spacing:-.01em">Expertise</div><div class="a" style="left:26px;top:146px;width:90px;height:8px;border-radius:4px;background:rgba(255,255,255,.55)"></div>
    <div class="a" style="right:22px;bottom:20px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9)"></div></div>`,
  'width:320px;height:250px;filter:drop-shadow(0 30px 40px rgba(28,111,224,.35))','t');
const pan=mk(s2,`<div class="a mono" style="left:44px;top:40px;font-size:22px;color:${MUTE}">FUTURISTICBD STUDIO</div>
  <div class="a" style="left:44px;top:90px;width:772px;height:2px;background:#E6EEF9"></div>
  <div id="pf" class="a" style="left:50%;top:60%;width:300px;height:170px;margin:-85px 0 0 -150px;border-radius:26px;border:3px dashed rgba(61,146,245,.5);background:rgba(98,188,255,.08)"></div>
  <div class="sk" style="left:44px;top:430px;width:300px"></div><div class="sk" style="left:44px;top:460px;width:200px"></div>`,
  'width:860px;height:520px;border-radius:48px','t glass');

/* S3 · tunnel of phones */
const s3=scene(6.2,10.15,(t)=>{
  const inn=eo3((t-6.2)/.6), fast=eiX((t-9.55)/.55);
  const camZ=lerp(-900,2300,(t-6.2)/3.9)+fast*1800;
  world.style.transform=`translateZ(${camZ.toFixed(1)}px) rotateZ(${(-8+6*Math.sin(t*.6)).toFixed(2)}deg)`;
  PH.forEach(({p,z})=>{const ez=z+camZ; p.style.opacity=clamp((ez+2300)/900).toFixed(3);});
  put(halo,{x:CX,y:930,o:inn*.9*(1-eio((t-9.6)/.3))});
  tun.style.opacity=inn*(1-eio((t-9.85)/.3)); tun.style.filter=`blur(${((1-inn)*16+fast*10).toFixed(1)}px)`;
  const L=[['Planning.',6.75,'g'],['Scripting.',7.2,'g'],['Shooting.',7.65,'g'],['Editing.',8.1,'']];
  const o1=eio((t-8.6)/.3);
  L.forEach(([s,a],i)=>{const e=T3[i], v=eo3((t-a)/.55); put(e,{x:[CX-170,CX+170,CX-170,CX+170][i],y:i<2?885:975,o:clamp(v*1.4)*(1-o1),b:(1-v)*16+o1*14,pre:`translateX(${((1-v)*40).toFixed(1)}px)`});});
  rv(t3b,t,8.72,{st:.13}); const o2=eio((t-9.55)/.3); put(t3b.d,{x:CX,y:930,o:1-o2,b:o2*20,s:1+o2*.2});});
const tun=mk(s3,'','width:1080px;height:1920px;perspective:1000px;perspective-origin:510px 930px');
const world=mk(tun,'','left:510px;top:930px;width:0;height:0;transform-style:preserve-3d');
const PH=[];
for(let k=0;k<3;k++){const z=-k*1250;
  [['-300px,800px',`rotateX(-90deg)`,'600px','1080px','50% 0'],['-300px,-800px',`rotateX(-90deg)`,'600px','1080px','50% 0'],
   ['-680px,-300px',`rotateY(90deg)`,'1080px','600px','0 50%'],['680px,-300px',`rotateY(90deg)`,'1080px','600px','0 50%']].forEach(([xy,rot,w,h,o],j)=>{
    const land=j>=2; const p=mk(world,land?`<div class="a" style="left:0;top:0;width:600px;height:1080px;transform-origin:0 0;transform:translate(1080px,0) rotate(90deg)">${phoneUI(k+j)}</div>`:phoneUI(k+j),
      `width:${w};height:${h};border-radius:66px;background:#0E1726;transform-origin:${o};transform:translate3d(${xy},${z}px) ${rot};box-shadow:0 0 0 2px #26344a;overflow:hidden`);
    PH.push({p,z});});}
const halo=mk(s3,'','width:900px;height:420px;border-radius:50%;background:radial-gradient(ellipse,rgba(243,246,251,.95) 30%,rgba(243,246,251,0) 70%)','t');
const T3=['Planning.','Scripting.','Shooting.','Editing.'].map((s,i)=>mk(s3,s,`font-size:74px;${i==3?'':''}`,'t'+(i<3?' g':'')));
const t3b=words(s3,[['All'],['done'],['for','g'],['you.','g']],'font-size:104px;font-weight:600;letter-spacing:-.045em');

/* S4 · ribbon → progress → Live ✓ + confetti */
const s4=scene(9.7,13.45,(t)=>{
  const rp=eio5((t-9.75)/.7), rf=eio((t-10.35)/.25);
  const rib=s4.querySelector('#rib'), rl=rib.getTotalLength(); rib.style.strokeDasharray=rl; rib.style.strokeDashoffset=(rl*(1-rp)).toFixed(1);
  const ribTail=eio((t-10.4)/.35); rib.style.opacity=1-ribTail;
  const ba=eo3((t-10.35)/.3), fillP=eio((t-10.65)/1.25);
  const bw=820*(1-eio5((t-11.95)/.35))+130*eio5((t-11.95)/.35), bh=lerp(78,130,eio5((t-11.95)/.35));
  Object.assign(bar.style,{width:bw+'px',height:bh+'px',borderRadius:bh/2+'px'});
  put(bar,{x:CX,y:1010,o:clamp(ba*2)*(1-eio((t-12.35)/.15))});
  Object.assign(barF.style,{width:Math.max(bh,(bw)*Math.max(fillP,t>11.95?1:0))+'px',height:bh+'px',borderRadius:bh/2+'px'});
  const lo=eio((t-11.9)/.25);
  rv(t4a,t,10.55,{st:.1}); put(t4a.d,{x:CX-410,y:900,ax:'l',o:1-lo,b:lo*14});
  const pct=Math.round(fillP*100); if(t4n._v!==pct){t4n.textContent=pct+'%';t4n._v=pct;}
  put(t4n,{x:CX+410,y:896,pre:'translateX(-50%)',o:clamp((t-10.65)/.3)*(1-lo),b:lo*14});
  // check disk
  const ck=SPR(t-12.3,18,.6); put(disk,{x:CX,y:1010,s:Math.max(0,ck),o:clamp(ck*3)*(1-eio((t-13.15)/.3))});
  const cp=disk.querySelector('path'), cl=cp.getTotalLength(); cp.style.strokeDasharray=cl; cp.style.strokeDashoffset=(cl*(1-eio((t-12.45)/.35))).toFixed(1);
  rv(t4b,t,12.35,{d:.5,dx:0,dy:30,bl:20}); put(t4b.d,{x:CX,y:760,o:1-eio((t-13.15)/.3)});
  // confetti
  CF.forEach(c=>{const u=t-12.38; if(u<0||u>1.2){c.e.style.display='none';return;}
    const x=CX+c.vx*u, y=1010+c.vy*u+1900*u*u; put(c.e,{x,y,r:c.r+c.vr*u,sx:Math.cos(u*c.fl),o:clamp((1.2-u)/.3),b:c.b});});});
s4.innerHTML+=`<svg class="a" style="left:0;top:0" width="1080" height="1920"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1C6FE0"/><stop offset="1" stop-color="#7CC8FF"/></linearGradient></defs>
  <path id="rib" d="M-200 260 C 260 300, 380 760, 300 1010 L 925 1010" fill="none" stroke="url(#rg)" stroke-width="130" stroke-linecap="round"/></svg>`;
const bar=mk(s4,'','background:#E6EEF9;box-shadow:inset 0 2px 6px rgba(20,60,140,.12)','t');
const barF=mk(bar,'',`left:0;top:0;background:${GRAD};box-shadow:0 14px 40px -10px rgba(40,120,235,.7)`);
const t4a=words(s4,[['Your'],['brand']],'font-size:76px');
const t4n=mk(s4,'0%','font-size:90px;font-weight:600;letter-spacing:-.04em','t g');
const disk=mk(s4,`<svg width="200" height="200" viewBox="0 0 100 100"><path d="M30 52 L44 66 L72 36" fill="none" stroke="#1C6FE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  'width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#EAF3FF);box-shadow:0 0 0 3px rgba(98,188,255,.6) inset,0 30px 70px -20px rgba(40,120,235,.6)','t');
const t4b=words(s4,[['Live.','g']],'font-size:150px;font-weight:600;letter-spacing:-.05em');
const CF=[...Array(64)].map((_,i)=>{const a=-Math.PI/2+(rnd(i,1)-.5)*2.6, v=900+rnd(i,2)*1300;
